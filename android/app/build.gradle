plugins {
    id 'com.android.application'
}

android {
    namespace 'org.openxray'
    compileSdk 33

    defaultConfig {
        applicationId "org.openxray"
        minSdk 29
        targetSdk 33
        versionCode 1
        versionName "1.6.02"

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
        debug {
            debuggable true
            jniDebuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

task syncJniLibs(type: Copy) {
    into "${projectDir}/src/main/jniLibs/arm64-v8a"
    from("../../bin/aarch64/Release") {
        include "*.so"
    }
    from("../../android/sysroot/arm64-v8a/lib") {
        include "*.so"
    }
}

tasks.preBuild.dependsOn(syncJniLibs)

dependencies {
}
